version: 2

models:
  - name: int_customer_orders
    description: "Aggregates order activity and revenue at the customer level."

    columns:
      - name: customer_id
        description: "Unique identifier for the customer."

      - name: order_count
        description: "Number of orders placed by the customer."

      - name: total_revenue
        description: "Total order revenue generated by the customer."
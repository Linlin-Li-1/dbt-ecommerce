version: 2

models:
  - name: fct_customer_summary
    description: "Customer-level summary of order activity and revenue."

    columns:
      - name: customer_id
        description: "Unique identifier for the customer."
        data_tests:
          - not_null
          - unique

      - name: order_count
        description: "Number of orders placed by the customer."

      - name: total_revenue
        description: "Total order revenue generated by the customer."